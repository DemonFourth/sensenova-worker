<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SenseNova U1 Fast - 信息图生成器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
      color: #333;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    
    header {
      text-align: center;
      margin-bottom: 2rem;
      color: white;
    }
    
    header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    
    header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }
    
    .card {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #555;
    }
    
    textarea {
      width: 100%;
      min-height: 180px;
      padding: 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      transition: border-color 0.2s;
    }
    
    textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .size-selector {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    
    .size-option {
      padding: 0.75rem 1.25rem;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    
    .size-option:hover {
      border-color: #667eea;
    }
    
    .size-option.selected {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }
    
    button {
      width: 100%;
      padding: 1rem 2rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .result-section {
      display: none;
    }
    
    .result-section.show {
      display: block;
    }
    
    .loading {
      text-align: center;
      padding: 2rem;
      color: #667eea;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f0f0f0;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .image-result {
      text-align: center;
    }
    
    .image-result img {
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }
    
    .image-url {
      margin-top: 1rem;
      padding: 1rem;
      background: #f5f5f5;
      border-radius: 8px;
      word-break: break-all;
      font-family: monospace;
      font-size: 0.9rem;
    }
    
    .error {
      background: #fee;
      border: 1px solid #fcc;
      color: #c00;
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
    }
    
    .hint {
      font-size: 0.85rem;
      color: #888;
      margin-top: 0.5rem;
    }
    
    .api-info {
      font-size: 0.8rem;
      color: #999;
      text-align: center;
      margin-top: 1rem;
    }
    
    @media (max-width: 600px) {
      body { padding: 1rem; }
      header h1 { font-size: 1.8rem; }
      .card { padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>?? SenseNova U1 Fast</h1>
      <p>信息图生成器</p>
    </header>

    <div class="card">
      <div class="form-group">
        <label for="prompt">?? 图像描述</label>
        <textarea id="prompt" placeholder="详细描述你想生成的信息图内容...&#10;&#10;示例：&#10;这张信息图以柔和的粉色、淡黄色和浅蓝色为主色调，采用了极具亲和力的可爱卡通风格。整体排版从左到右分为三个主要区块，分别介绍核心能力、工作流程和重要规则。"></textarea>
        <p class="hint">最大支持 4096 tokens，描述越详细，生成效果越好</p>
      </div>

      <div class="form-group">
        <label>?? 图像尺寸</label>
        <div class="size-selector" id="sizeSelector">
          <div class="size-option selected" data-size="2752x1536">16:9 (2752×1536)</div>
          <div class="size-option" data-size="2496x1664">3:2 (2496×1664)</div>
          <div class="size-option" data-size="1664x2496">2:3 (1664×2496)</div>
          <div class="size-option" data-size="2048x2048">1:1 (2048×2048)</div>
          <div class="size-option" data-size="1536x2752">9:16 (1536×2752)</div>
          <div class="size-option" data-size="3072x1376">21:9 (3072×1376)</div>
        </div>
      </div>

      <button id="generateBtn" onclick="generate()">? 生成信息图</button>
    </div>

    <div class="card result-section" id="resultSection">
      <h2 style="margin-bottom: 1rem;">??? 生成结果</h2>
      
      <div id="loading" class="loading">
        <div class="loading-spinner"></div>
        <p>正在调用 SenseNova U1 Fast 生成图像...</p>
        <p class="hint">通常需要 10-30 秒，请耐心等待</p>
      </div>

      <div id="imageResult" class="image-result" style="display: none;">
        <img id="generatedImage" src="" alt="生成的信息图">
        <div class="image-url">
          <strong>图像 URL:</strong><br>
          <a id="imageUrl" href="" target="_blank"></a>
        </div>
        <button onclick="downloadImage()" style="margin-top: 1rem; width: auto; padding: 0.75rem 2rem;">?? 下载图片</button>
      </div>

      <div id="errorResult" class="error" style="display: none;"></div>
    </div>

    <p class="api-info">
      Powered by <a href="https://platform.sensenova.cn/docs" target="_blank" style="color: #667eea;">SenseNova Platform</a>
    </p>
  </div>

  <script>
    let selectedSize = '2752x1536';

    // 尺寸选择器
    document.querySelectorAll('.size-option').forEach(option => {
      option.addEventListener('click', () => {
        document.querySelectorAll('.size-option').forEach(o => o.classList.remove('selected'));
        option.classList.add('selected');
        selectedSize = option.dataset.size;
      });
    });

    async function generate() {
      const prompt = document.getElementById('prompt').value.trim();
      const btn = document.getElementById('generateBtn');
      const resultSection = document.getElementById('resultSection');
      const loading = document.getElementById('loading');
      const imageResult = document.getElementById('imageResult');
      const errorResult = document.getElementById('errorResult');

      if (!prompt) {
        alert('请输入图像描述！');
        return;
      }

      // 重置状态
      resultSection.classList.add('show');
      loading.style.display = 'block';
      imageResult.style.display = 'none';
      errorResult.style.display = 'none';
      btn.disabled = true;
      btn.textContent = '? 生成中...';

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            prompt: prompt,
            size: selectedSize,
            n: 1,
          }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || data.details || '生成失败');
        }

        // 显示结果
        const imageUrl = data.data?.[0]?.url;
        if (!imageUrl) {
          throw new Error('未返回图像 URL');
        }

        document.getElementById('generatedImage').src = imageUrl;
        document.getElementById('imageUrl').href = imageUrl;
        document.getElementById('imageUrl').textContent = imageUrl;

        loading.style.display = 'none';
        imageResult.style.display = 'block';

      } catch (error) {
        loading.style.display = 'none';
        errorResult.style.display = 'block';
        errorResult.textContent = \? 错误: \\;
        console.error('Generation error:', error);
      } finally {
        btn.disabled = false;
        btn.textContent = '? 生成信息图';
      }
    }

    async function downloadImage() {
      const imageUrl = document.getElementById('imageUrl').href;
      try {
        const response = await fetch(imageUrl);
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = \sensenova-infographic-\.png\;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (error) {
        alert('下载失败，请右键图片保存：' + error.message);
      }
    }
  </script>
</body>
</html>
